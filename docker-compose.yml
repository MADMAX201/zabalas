# zabalas.online — proyecto totalmente independiente: contenedor, red y datos propios.
# El Nginx del sistema reenvía zabalas.online -> 127.0.0.1:3010 (ver DEPLOY.md).
name: zabalas

services:
  app:
    build: .
    container_name: zabalas-app
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - zabalas-net

networks:
  zabalas-net:
    name: zabalas-net
