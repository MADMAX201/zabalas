# Bloque de Nginx para zabalas.online -> contenedor zabalas-app (127.0.0.1:3010)
# Copiar a /etc/nginx/sites-available/zabalas.online y enlazar en sites-enabled.
# certbot --nginx agrega luego el bloque 443 automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name zabalas.online www.zabalas.online;

    client_max_body_size 210m;   # videos de la galería (hasta 200 MB)
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
